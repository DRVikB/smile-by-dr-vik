<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 176 724 724" fill="none">
  <!-- The SmileCompose mark, animated: the guide lines draw, the smile is drawn across them, then a soft light
       travels along it. Charcoal, for light backgrounds. Same motion as the app (src/components/ComposingMark.tsx). -->
  <defs>
    <linearGradient id="fill" x1="215" y1="380" x2="810" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#736C61"/><stop offset="1" stop-color="#2B2E2B"/></linearGradient>
    <mask id="smile" maskUnits="userSpaceOnUse" x="150" y="330" width="724" height="480"><path d="M215 431.5C336.5 769 687.5 769 809 431.5" stroke="#fff" stroke-width="82" stroke-linecap="round"/></mask>
    <style>
      .g,.a,.r{stroke-linecap:round;stroke-dasharray:100 200;stroke-dashoffset:101}
      .g{stroke:rgba(161,148,127,.7);stroke-width:17;animation:d .9s ease-out .2s forwards}
      .g2{animation-delay:.5s}
      .a{stroke-width:82;animation:d 1.7s cubic-bezier(.5,0,.15,1) 1s forwards}
      .r{stroke:rgba(255,255,255,.55);stroke-width:2.5;animation:d 1.2s ease-out 2.3s forwards}
      .s{stroke:#FFFFFF;stroke-width:82;stroke-linecap:round;stroke-dasharray:14 130;stroke-dashoffset:20;opacity:0;animation:s 3.8s linear 3.4s infinite}
      @keyframes d{to{stroke-dashoffset:0}}
      @keyframes s{0%{stroke-dashoffset:20;opacity:0}8%,38%{opacity:.34}46%,100%{stroke-dashoffset:-110;opacity:0}}
      @media (prefers-reduced-motion:reduce){.g,.a,.r{animation:none;stroke-dashoffset:0}.s{animation:none}}
    </style>
  </defs>
  <path class="g" pathLength="100" d="M512 251.5V856.5"/>
  <path class="g g2" pathLength="100" d="M270 481.5H755"/>
  <path class="a" pathLength="100" d="M215 431.5C336.5 769 687.5 769 809 431.5" stroke="url(#fill)"/>
  <path class="r" pathLength="100" d="M215 431.5C336.5 769 687.5 769 809 431.5" transform="translate(0 -36)"/>
  <g mask="url(#smile)"><path class="s" pathLength="100" d="M215 431.5C336.5 769 687.5 769 809 431.5"/></g>
</svg>
